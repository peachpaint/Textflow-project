spring.application.name=Textflow-project
server.servlet.context-path=/Textflow

# Database Configuration (use environment variables for security)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/textflow?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1111}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.database=mysql
spring.jpa.properties.javax.persistence.validation.mode=none

# Static Assets Mode (true = use hardcoded data, false = use DB)
home.useStaticAssets=${USE_STATIC_ASSETS:true}

# Locale and Timezone
spring.jackson.time-zone=Asia/Seoul
spring.jackson.locale=ko_KR

# Connection Pool (Hikari Configuration)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# File Upload Settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.org.example.textflowproject=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

